        function getKyivUpdateText() {
          var now = new Date();
          var timeParts = new Intl.DateTimeFormat("uk-UA", {
            timeZone: "Europe/Kyiv",
            hour: "2-digit",
            minute: "2-digit",
            hour12: false
          }).formatToParts(now);
          var dateParts = new Intl.DateTimeFormat("uk-UA", {
            timeZone: "Europe/Kyiv",
            day: "2-digit",
            month: "2-digit",
            year: "numeric"
          }).formatToParts(now);
          var hour = timeParts.find(function (part) { return part.type === "hour"; }).value;
          var minute = timeParts.find(function (part) { return part.type === "minute"; }).value;
          var day = dateParts.find(function (part) { return part.type === "day"; }).value;
          var month = dateParts.find(function (part) { return part.type === "month"; }).value;
          var year = dateParts.find(function (part) { return part.type === "year"; }).value;
          return hour + ":" + minute + " | " + day + "." + month + "." + year;
        }

    <div id="tokenGate" style="position:fixed;inset:0;z-index:99999;background:#b3d3ea url('/img/light_background.png') center/cover no-repeat;display:flex;align-items:center;justify-content:center;flex-direction:column;font-family:e-UkraineLocal,Arial,sans-serif">
      <div style="background:rgba(255,255,255,.92);border-radius:24px;padding:40px 32px;width:min(90%,380px);box-sizing:border-box;text-align:center;box-shadow:0 8px 40px rgba(0,0,0,.15)">
        <div style="font-size:22px;font-weight:500;margin-bottom:8px;color:#050505">Доступ до сайту</div>
        <div style="font-size:14px;color:#6b7785;margin-bottom:24px">Введіть токен авторизації</div>
        <input id="tokenInput" type="text" placeholder="XXXXXXXX-XXXXXXXX" style="width:100%;padding:14px 16px;border:2px solid #d8dee2;border-radius:14px;font-size:16px;outline:0;box-sizing:border-box;text-align:center;font-family:inherit" autocomplete="off" />
        <div id="tokenError" style="color:#e53935;font-size:13px;margin-top:10px;display:none"></div>
        <button id="tokenSubmit" type="button" style="width:100%;margin-top:18px;padding:14px;background:#000;color:#fff;border:0;border-radius:14px;font-size:16px;font-weight:600;font-family:inherit;cursor:pointer">Увійти</button>
      </div>
    </div>
    <div id="app"></div>
    <script>
      (function () {
        var tokenGate = document.getElementById("tokenGate");
        var tokenInput = document.getElementById("tokenInput");
        var tokenError = document.getElementById("tokenError");
        var tokenSubmit = document.getElementById("tokenSubmit");

        function validateOnServer(token) {
          return fetch("/api/validate-token?token=" + encodeURIComponent(token))
            .then(function (r) { return r.json(); });
        }

        function unlockAccess(token, data) {
          localStorage.setItem("auth_token", token);
          localStorage.setItem("auth_token_expires", String(Math.floor(data.exp * 1000)));
          localStorage.setItem("auth_name", data.name || "");
          localStorage.setItem("auth_photo_b64", data.photo_b64 || "");
          tokenGate.style.display = "none";
          document.documentElement.classList.remove("token-auth-locked");
        }

        function showError(msg) {
          tokenError.textContent = msg;
          tokenError.style.display = "block";
        }

        function hideError() {
          tokenError.style.display = "none";
        }

        function lockGate() {
          tokenGate.style.display = "flex";
          document.documentElement.classList.add("token-auth-locked");
        }

        // Check cached token on load — validate with server
        (function checkExistingToken() {
          var cachedToken = localStorage.getItem("auth_token");
          var cachedExpiry = localStorage.getItem("auth_token_expires");

          if (cachedToken && cachedExpiry && Date.now() < parseInt(cachedExpiry, 10)) {
            tokenInput.disabled = true;
            tokenSubmit.disabled = true;
            tokenSubmit.textContent = "Перевірка...";
            lockGate();

            validateOnServer(cachedToken).then(function (data) {
              if (data.valid) {
                unlockAccess(cachedToken, data);
              } else {
                localStorage.removeItem("auth_token");
                localStorage.removeItem("auth_token_expires");
                localStorage.removeItem("auth_name");
                localStorage.removeItem("auth_photo_b64");
                tokenInput.disabled = false;
                tokenSubmit.disabled = false;
                tokenSubmit.textContent = "Увійти";
                showError("Токен відкликано або прострочено");
              }
            });
          } else {
            localStorage.removeItem("auth_token");
            localStorage.removeItem("auth_token_expires");
            localStorage.removeItem("auth_name");
            localStorage.removeItem("auth_photo_b64");
            lockGate();
          }
        })();

        function handleSubmit() {
          var token = tokenInput.value.trim();
          if (!token) {
            showError("Введіть токен");
            return;
          }
          hideError();
          tokenSubmit.disabled = true;
          tokenSubmit.textContent = "Перевірка...";
          validateOnServer(token).then(function (data) {
            tokenSubmit.disabled = false;
            tokenSubmit.textContent = "Увійти";
            if (data.valid) {
              unlockAccess(token, data);
            } else {
              showError("Невірний або прострочений токен");
            }
          });
        }

        tokenSubmit.addEventListener("click", handleSubmit);
        tokenInput.addEventListener("keydown", function (e) {
          if (e.key === "Enter") handleSubmit();
        });
      })();
    </script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("/service-worker.js", { scope: "/" }).catch(function () {});
        });
      }

      (function () {
        function updateNativeSliderCards() {
          document.querySelectorAll(".slider").forEach(function (slider) {
            var cards = Array.prototype.slice.call(slider.children);
            if (!cards.length) return;

            var index = parseInt(getComputedStyle(slider).getPropertyValue("--index"), 10);
            if (!Number.isFinite(index)) index = 0;

            cards.forEach(function (card, cardIndex) {
              card.classList.toggle("is-slider-active", cardIndex === index);
              card.classList.toggle("is-slider-prev", cardIndex === index - 1);
              card.classList.toggle("is-slider-next", cardIndex === index + 1);
            });
          });
        }

        var frame = null;
        function scheduleNativeSliderUpdate() {
          if (frame) return;
          frame = requestAnimationFrame(function () {
            frame = null;
            updateNativeSliderCards();
          });
        }

        window.addEventListener("load", scheduleNativeSliderUpdate);
        window.addEventListener("resize", scheduleNativeSliderUpdate);
        setInterval(scheduleNativeSliderUpdate, 250);
      })();
    </script>
