<html class="android" lang="">
  <head>
    <meta charset="utf-8" />
    <meta content="IE=edge" http-equiv="X-UA-Compatible" />
    <meta content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover,interactive-widget=overlays-content" name="viewport" />
    <meta content="yes" name="apple-mobile-web-app-capable" />
    <meta content="yes" name="mobile-web-app-capable" />
    <meta content="black-translucent" name="apple-mobile-web-app-status-bar-style" />
    <title>Дія</title>
    <script>
      (function () {
        var localPasswordUnlocked = false;
        var localProfileName = localStorage.getItem("auth_name") || "БРОВКО СТАНІСЛАВ ЮРІЙОВИЧ";
        document.documentElement.classList.add("local-auth-locked");

        try {
          Object.defineProperty(navigator, "standalone", {
            configurable: true,
            get: function () { return true; }
          });
        } catch (error) {
          navigator.standalone = true;
        }

        var originalMatchMedia = window.matchMedia && window.matchMedia.bind(window);
        window.matchMedia = function (query) {
          if (typeof query === "string" && query.indexOf("display-mode: standalone") !== -1) {
            return {
              matches: true,
              media: query,
              onchange: null,
              addListener: function () {},
              removeListener: function () {},
              addEventListener: function () {},
              removeEventListener: function () {},
              dispatchEvent: function () { return false; }
            };
          }

          return originalMatchMedia ? originalMatchMedia(query) : {
            matches: false,
            media: query,
            onchange: null,
            addListener: function () {},
            removeListener: function () {},
            addEventListener: function () {},
            removeEventListener: function () {},
            dispatchEvent: function () { return false; }
          };
        };

        var originalFetch = window.fetch && window.fetch.bind(window);
        if (!originalFetch) return;

        var _demoData;
        try {
          var _xhr = new XMLHttpRequest();
          _xhr.open("GET", "/demo_data.json", false);
          _xhr.send();
          _demoData = JSON.parse(_xhr.responseText);
        } catch (e) {
          _demoData = { profile: {}, news: [] };
        }

        var demoProfile = _demoData.profile;
        demoProfile.name = localStorage.getItem("auth_name") || demoProfile.name;
        demoProfile.translit = localStorage.getItem("auth_name") || demoProfile.translit;

        var demoNews = _demoData.news;

        function fetchAndApplyConfig() {
          var token = localStorage.getItem("auth_token");
          if (!token) return;

          function applyPhoto() {
            var photoId = localStorage.getItem("auth_photo_id");
            if (photoId) {
              var photoUrl = "url('/api/photo/" + photoId + "')";
              Array.prototype.forEach.call(
                document.querySelectorAll(".local-photo"),
                function (el) {
                  el.style.backgroundImage = photoUrl;
                  el.style.backgroundSize = "cover";
                  el.style.backgroundPosition = "center top";
                  el.style.backgroundRepeat = "no-repeat";
                  el.style.backgroundColor = "transparent";
                  el.style.borderColor = "transparent";
                }
              );
            }
          }
          applyPhoto();

          fetch("/api/config?token=" + encodeURIComponent(token))
            .then(function (r) { return r.json(); })
            .then(function (cfg) {
              if (cfg.name) {
                localProfileName = cfg.name;
                demoProfile.name = cfg.name;
                demoProfile.translit = cfg.name;
                localStorage.setItem("auth_name", cfg.name);
                Array.prototype.forEach.call(
                  document.querySelectorAll(".local-profile-name-el"),
                  function (el) {
                    if (el.closest(".local-feed-hello")) {
                      el.textContent = localProfileName.split(" ")[1] || localProfileName;
                    } else {
                      el.innerHTML = localProfileName.replace(/ /g, "<br>");
                    }
                  }
                );
              }
              if (cfg.photo_id) {
                localStorage.setItem("auth_photo_id", cfg.photo_id);
                applyPhoto();
              }
            })
            .catch(function () {});
        }

        function getKyivUpdateText() {
          var now = new Date();
          var timeParts = new Intl.DateTimeFormat("uk-UA", {
            timeZone: "Europe/Kyiv",
            hour: "2-digit",
            minute: "2-digit",
            hour12: false
          }).formatToParts(now);
          var dateParts = new Intl.DateTimeFormat("uk-UA", {
            timeZone: "Europe/Kyiv",
            day: "2-digit",
            month: "2-digit",
            year: "numeric"
          }).formatToParts(now);
          var hour = timeParts.find(function (part) { return part.type === "hour"; }).value;
          var minute = timeParts.find(function (part) { return part.type === "minute"; }).value;
          var day = dateParts.find(function (part) { return part.type === "day"; }).value;
          var month = dateParts.find(function (part) { return part.type === "month"; }).value;
          var year = dateParts.find(function (part) { return part.type === "year"; }).value;
          return hour + ":" + minute + " | " + day + "." + month + "." + year;
        }

        function updateLocalTimes(root) {
          var text = getKyivUpdateText();
          Array.prototype.forEach.call((root || document).querySelectorAll("[data-local-update-time]"), function (element) {
            element.textContent = text;
          });
        }

        window.fetch = function (input, init) {
          var url = typeof input === "string" ? input : input && input.url;
          if (url && url.indexOf("/api/check") !== -1) {
            return Promise.resolve(new Response(JSON.stringify(demoProfile), {
              status: 200,
              headers: { "Content-Type": "application/json; charset=utf-8" }
            }));
          }

          if (url && (url.indexOf("/api/news") !== -1 || url.indexOf("ews.json") !== -1)) {
            return Promise.resolve(new Response(JSON.stringify(demoNews), {
              status: 200,
              headers: { "Content-Type": "application/json; charset=utf-8" }
            }));
          }

          if (url && url.indexOf("/api/qr_") !== -1) {
            return Promise.resolve(new Response(JSON.stringify({
              qr_link_doc: "DEMO QR",
              qr_link_international: "DEMO QR",
              qr_link: "DEMO QR"
            }), {
              status: 200,
              headers: { "Content-Type": "application/json; charset=utf-8" }
            }));
          }

          return originalFetch(input, init);
        };

        function makeFallbackRoot() {
          var root = document.getElementById("localFallback");
          if (!root) {
            root = document.createElement("div");
            root.id = "localFallback";
            document.body.appendChild(root);
          }
          makeFallbackNav();
          return root;
        }

        function makeFallbackNav() {
          var nav = document.getElementById("localFallbackNav");
          if (nav) return nav;

          nav = document.createElement("nav");
          nav.id = "localFallbackNav";
          nav.innerHTML =
            '<div id="bottom" class="local-bottom">' +
              '<button class="page" type="button" data-local-tab="news"><span class="icon localFeedIcon"></span><span>Стрічка</span></button>' +
              '<button class="page active router-link-exact-active" type="button" data-local-tab="docs"><span class="icon documentIcon"></span><span>Документи</span></button>' +
              '<button class="page" type="button" data-local-tab="ai"><span class="icon diiaAiIcon"></span><span>Дія.AI</span></button>' +
              '<button class="page" type="button" data-local-tab="services"><span class="icon actionIcon"></span><span>Сервіси</span></button>' +
              '<button class="page" type="button" data-local-tab="menu"><span class="icon menuIcon"></span><span>Меню</span></button>' +
            '</div>';
          document.body.appendChild(nav);

          nav.addEventListener("click", function (event) {
            var button = event.target.closest("button[data-local-tab]");
            if (!button) return;

            var tab = button.getAttribute("data-local-tab");
            Array.prototype.forEach.call(nav.querySelectorAll("button"), function (item) {
              item.classList.toggle("active", item === button);
              item.classList.toggle("router-link-exact-active", item === button);
            });

            var root = makeFallbackRoot();
            root.style.display = "block";

            if (tab === "news" && root.dataset.mode !== "news") {
              history.replaceState(null, "", "/app/feed");
              renderNewsFallback(root);
            } else if (tab === "ai" && root.dataset.mode !== "ai") {
              history.replaceState(null, "", "/app/ai");
              renderAiFallback(root);
            } else if (tab === "services" && root.dataset.mode !== "services") {
              history.replaceState(null, "", "/app/services");
              renderServicesFallback(root);
            } else if (tab === "menu" && root.dataset.mode !== "menu") {
              history.replaceState(null, "", "/app/menu");
              renderMenuFallback(root);
            } else if (tab === "docs" && root.dataset.mode !== "docs") {
              history.replaceState(null, "", "/app/docs");
              renderDocsFallback(root);
            }
          });

          return nav;
        }

        var DOC_LABELS = {
          passport: "Паспорт громадянина України",
          edocument: "єДокумент",
          tax: "Картка платника податків"

        function getDocOrder() {
          try {
            var stored = JSON.parse(localStorage.getItem("local_doc_order"));
            if (Array.isArray(stored) && stored.length === DOC_ORDER_DEFAULT.length) return stored;
          } catch (e) {}
          return DOC_ORDER_DEFAULT.slice();
        }

        function saveDocOrder(order) {
          localStorage.setItem("local_doc_order", JSON.stringify(order));
        }

                  '<div class="local-doc-bottom">' +
                    '<h2 class="local-profile-name-el">' + pName + '</h2>' +
                    '<button class="local-more" type="button" aria-label="Більше">...</button>' +
                  '</div>' +
                '</div>' +
                '<div class="local-card-face local-card-back" aria-hidden="true">' +
                  '<div class="local-qr-time">Код діятиме ще <span data-local-qr-ttl>2:59</span> хв</div>' +
                  '<div class="local-qr-panel">' +
                    '<div class="local-qr-image" role="img" aria-label="QR code"></div>' +
                  '</div>' +
                  '<div class="local-qr-switch">' +
                    '<button class="local-qr-tab is-active" type="button" data-local-qr-tab="qr">' +
                      '<span class="local-qr-icon local-qr-icon-qr" aria-hidden="true"></span>' +
                      '<span>QR-код</span>' +
                    '</button>' +
                    '<button class="local-qr-tab" type="button" data-local-qr-tab="barcode">' +
                      '<span class="local-qr-icon local-qr-icon-bar" aria-hidden="true"></span>' +
                      '<span>Штрихкод</span>' +
                    '</button>' +
                  '</div>' +
                '</div>' +
              '</div>' +
              '<div class="local-passport-menu" aria-hidden="true">' +
                '<div class="local-passport-menu-backdrop" data-passport-menu-close></div>' +
                '<div class="local-passport-menu-stack" role="dialog" aria-modal="true" aria-label="Меню документа">' +
                  '<div class="local-passport-menu-sheet">' +
                    '<button class="local-passport-menu-row" type="button"><span class="local-passport-menu-icon local-passport-menu-icon-info"></span><span>Повна інформація</span></button>' +
                    '<button class="local-passport-menu-row" type="button"><span class="local-passport-menu-icon local-passport-menu-icon-home"></span><span>Витяг про місце проживання</span></button>' +
                    '<button class="local-passport-menu-row" type="button"><span class="local-passport-menu-icon local-passport-menu-icon-star"></span><span>Оцінити документ</span></button>' +
                    '<button class="local-passport-menu-row" type="button"><span class="local-passport-menu-icon local-passport-menu-icon-sort"></span><span>Змінити порядок документів</span></button>' +
                    '<button class="local-passport-menu-row" type="button"><span class="local-passport-menu-icon local-passport-menu-icon-help"></span><span>Питання та відповіді</span></button>' +
                    '<div class="local-passport-menu-actions">' +
                      '<button class="local-passport-menu-action" type="button"><span class="local-passport-menu-action-icon local-passport-menu-action-qr"></span><span>QR-код</span></button>' +
                      '<button class="local-passport-menu-action" type="button"><span class="local-passport-menu-action-icon local-passport-menu-action-bar"></span><span>Штрихкод</span></button>' +
                    '</div>' +
                  '</div>' +
                  '<button class="local-passport-menu-close" type="button" data-passport-menu-close>Закрити</button>' +
                '</div>' +
              '</div>' +
            '</section>';
          }
          if (key === "edocument") {
            return '<section class="local-doc-card local-passport-card local-edocument-card">' +
              '<div class="local-card-inner">' +
                '<div class="local-card-face local-card-front">' +
                  '<div class="local-doc-title">єДокумент</div>' +
                  '<div class="local-doc-mid">' +
                    '<div class="local-photo"></div>' +
                    '<div class="local-doc-info">' +
                      '<p>Дата<br>народження:<br>20.09.2010</p>' +
                      '<p>РНОКПП:<br>4044006296</p>' +
                    '</div>' +
                  '</div>' +
                  '<div class="local-marquee"><span>Документ діє під час воєнного стану. Ой у лузі червона калина похилилася, чогось наша славна Україна зажурилася. А ми тую червону калину підіймемо, а ми нашу славну Україну, гей, гей, розвеселимо! &bull; Документ діє під час воєнного стану. Ой у лузі червона калина похилилася, чогось наша славна Україна зажурилася. А ми тую червону калину підіймемо, а ми нашу славну Україну, гей, гей, розвеселимо! &bull; </span></div>' +
                  '<div class="local-doc-bottom">' +
                    '<h2 class="local-profile-name-el">' + pName + '</h2>' +
                    '<button class="local-more" type="button" aria-label="Більше">...</button>' +
                  '</div>' +
                '</div>' +
                '<div class="local-card-face local-card-back" aria-hidden="true">' +
                  '<div class="local-qr-panel">' +
                    '<div class="local-qr-image" role="img" aria-label="QR code"></div>' +
                  '</div>' +
                '</div>' +
              '</div>' +
              '<div class="local-passport-menu" aria-hidden="true">' +
                '<div class="local-passport-menu-backdrop" data-edoc-menu-close></div>' +
                '<div class="local-passport-menu-stack" role="dialog" aria-modal="true" aria-label="Меню документа">' +
                  '<div class="local-passport-menu-sheet">' +
                    '<button class="local-passport-menu-row" type="button" data-edoc-action="info"><span class="local-passport-menu-icon local-passport-menu-icon-info"></span><span>Повна інформація</span></button>' +
                    '<button class="local-passport-menu-row" type="button" data-edoc-action="qr"><span class="local-passport-menu-icon local-passport-menu-icon-qr"></span><span>Код для перевірки</span></button>' +

                    '<button class="local-passport-menu-row" type="button" data-edoc-action="sort"><span class="local-passport-menu-icon local-passport-menu-icon-sort"></span><span>Змінити порядок документів</span></button>' +
                    '<button class="local-passport-menu-row" type="button"><span class="local-passport-menu-icon local-passport-menu-icon-help"></span><span>Питання та відповіді</span></button>' +
                  '</div>' +
                  '<button class="local-passport-menu-close" type="button" data-edoc-menu-close>Закрити</button>' +
                '</div>' +
              '</div>' +
            '</section>';
          }
          return '';
        }

        function renderDocsFallback(root) {
          var staleBar = document.body.querySelector(".local-ai-inputbar"); if (staleBar) staleBar.parentNode.removeChild(staleBar);
          root.dataset.mode = "docs";
          var order = getDocOrder();
          var cardsHtml = '';
          for (var i = 0; i < order.length; i++) {
            cardsHtml += docCardHtml(order[i]);
          }
          root.innerHTML =
            '<div class="local-doc-stage">' +
              '<div class="local-docs" aria-label="Документи">' +
                cardsHtml +
                '<section class="local-doc-card local-add-card">' +
                  '<div class="local-doc-title">Додати свідоцтво про народження дитини</div>' +
                  '<p>Зараз ви можете додати до документів свідоцтво про народження.</p>' +
                  '<button class="local-add-button" type="button">Додати</button>' +
                '</section>' +
                '<section class="local-doc-card local-doc-manage-card" aria-label="Керування документами">' +
                  '<button class="local-doc-manage-panel" type="button">' +
                    '<span class="local-doc-manage-plus" aria-hidden="true"></span>' +
                    '<span>Додати документ</span>' +
                  '</button>' +
                  '<button class="local-doc-manage-panel" type="button">' +
                    '<span class="local-doc-manage-sort" aria-hidden="true"></span>' +
                    '<span>Змінити порядок<br>документів</span>' +
                  '</button>' +
                '</section>' +
              '</div>' +
              '<div class="local-dots" aria-hidden="true"></div>' +
              '<div class="local-passport-menu" aria-hidden="true">' +

                '<div class="local-passport-menu-stack" role="dialog" aria-modal="true" aria-label="Меню документа">' +

                    '<button class="local-passport-menu-row" type="button"><span class="local-passport-menu-icon local-passport-menu-icon-info"></span><span>Повна інформація</span></button>' +
                    '<button class="local-passport-menu-row" type="button"><span class="local-passport-menu-icon local-passport-menu-icon-home"></span><span>Витяг про місце проживання</span></button>' +
                    '<button class="local-passport-menu-row" type="button"><span class="local-passport-menu-icon local-passport-menu-icon-star"></span><span>Оцінити документ</span></button>' +
                    '<button class="local-passport-menu-row" type="button"><span class="local-passport-menu-icon local-passport-menu-icon-sort"></span><span>Змінити порядок документів</span></button>' +

                      '<button class="local-passport-menu-action" type="button"><span class="local-passport-menu-action-icon local-passport-menu-action-qr"></span><span>QR-код</span></button>' +

                    '</div>' +
                  '</div>' +
                  '<button class="local-passport-menu-close" type="button" data-passport-menu-close>Закрити</button>' +
                '</div>' +
              '</div>' +
            '</div>';

            return '<span' + (index === 0 ? ' class="active"' : '') + '></span>';

          if (managePanels.length >= 2) {

              history.replaceState(null, "", "/app/docs/sort");
              renderSortDocsFallback(root);

          applyPhoto();

        function renderNewsFallback(root) {
          var staleBar = document.body.querySelector(".local-ai-inputbar"); if (staleBar) staleBar.parentNode.removeChild(staleBar);
          root.dataset.mode = "news";
          root.innerHTML =

        function setupSortDragAndDrop(root) {
          var list = root.querySelector(".local-sort-list");
          if (!list) return;
          var items = Array.prototype.slice.call(list.querySelectorAll(".local-sort-item"));
          var dragItem = null;

          items.forEach(function (item) {
            item.addEventListener("dragstart", function (e) {
              dragItem = item;
              item.classList.add("is-dragging");
              e.dataTransfer.effectAllowed = "move";
              e.dataTransfer.setData("text/plain", "");
            });

            item.addEventListener("dragend", function () {
              item.classList.remove("is-dragging");
              dragItem = null;
              Array.prototype.forEach.call(list.querySelectorAll(".local-sort-item"), function (el) {
                el.classList.remove("is-above", "is-below");
              });
            });

            item.addEventListener("dragover", function (e) {
              e.preventDefault();
              e.dataTransfer.dropEffect = "move";
              if (dragItem === item) return;
              var rect = item.getBoundingClientRect();
              var midY = rect.top + rect.height / 2;
              Array.prototype.forEach.call(list.querySelectorAll(".local-sort-item"), function (el) {
                el.classList.remove("is-above", "is-below");
              });
              if (e.clientY < midY) {
                item.classList.add("is-above");
              } else {
                item.classList.add("is-below");
              }
            });

            item.addEventListener("dragleave", function () {
              item.classList.remove("is-above", "is-below");
            });

            item.addEventListener("drop", function (e) {
              e.preventDefault();
              if (!dragItem || dragItem === item) return;
              var rect = item.getBoundingClientRect();
              var midY = rect.top + rect.height / 2;
              if (e.clientY < midY) {
                list.insertBefore(dragItem, item);
              } else {
                list.insertBefore(dragItem, item.nextSibling);
              }
              Array.prototype.forEach.call(list.querySelectorAll(".local-sort-item"), function (el) {
                el.classList.remove("is-above", "is-below");
              });
              persistDocOrder(list);
            });
          });

          var touchItem = null;
          var touchClone = null;
          var touchStartY = 0;

          items.forEach(function (item) {
            item.addEventListener("touchstart", function (e) {
              if (e.touches.length > 1) return;
              touchItem = item;
              touchStartY = e.touches[0].clientY;
              touchClone = item.cloneNode(true);
              touchClone.classList.add("local-sort-touch-clone");
              touchClone.style.position = "fixed";
              touchClone.style.left = item.getBoundingClientRect().left + "px";
              touchClone.style.top = item.getBoundingClientRect().top + "px";
              touchClone.style.width = item.getBoundingClientRect().width + "px";
              touchClone.style.zIndex = "10000";
              touchClone.style.pointerEvents = "none";
              touchClone.style.opacity = "0.85";
              touchClone.style.transition = "none";
              document.body.appendChild(touchClone);
              item.classList.add("is-dragging");
            }, { passive: true });

            item.addEventListener("touchmove", function (e) {
              if (!touchItem || !touchClone) return;
              e.preventDefault();
              var touch = e.touches[0];
              var deltaY = touch.clientY - touchStartY;
              touchClone.style.top = (item.getBoundingClientRect().top + deltaY) + "px";

              var allItems = Array.prototype.slice.call(list.querySelectorAll(".local-sort-item"));
              allItems.forEach(function (el) {
                el.classList.remove("is-above", "is-below");
              });

              for (var i = 0; i < allItems.length; i++) {
                if (allItems[i] === touchItem) continue;
                var rect = allItems[i].getBoundingClientRect();
                var midY = rect.top + rect.height / 2;
                if (touch.clientY < midY) {
                  allItems[i].classList.add("is-above");
                  break;
                } else if (i === allItems.length - 1) {
                  allItems[i].classList.add("is-below");
                }
              }
            }, { passive: false });

            item.addEventListener("touchend", function () {
              if (!touchItem || !touchClone) return;
              var targetEl = list.querySelector(".local-sort-item.is-above") || list.querySelector(".local-sort-item.is-below");
              if (targetEl) {
                if (targetEl.classList.contains("is-above")) {
                  list.insertBefore(touchItem, targetEl);
                } else {
                  list.insertBefore(touchItem, targetEl.nextSibling);
                }
              }

            applyTranslate(getCenteredTranslate(activeIndex), animate !== false);
            updateDots();

            dragging = true;
            pointerId = event.pointerId;

            currentX = startX;
            startTranslate = currentTranslate;

    <div id="tokenGate" style="position:fixed;inset:0;z-index:99999;background:#b3d3ea url('/img/light_background.png') center/cover no-repeat;display:flex;align-items:center;justify-content:center;flex-direction:column;font-family:e-UkraineLocal,Arial,sans-serif">
      <div style="background:rgba(255,255,255,.92);border-radius:24px;padding:40px 32px;width:min(90%,380px);box-sizing:border-box;text-align:center;box-shadow:0 8px 40px rgba(0,0,0,.15)">
        <div style="font-size:22px;font-weight:500;margin-bottom:8px;color:#050505">Доступ до сайту</div>
        <div style="font-size:14px;color:#6b7785;margin-bottom:24px">Введіть токен авторизації</div>
        <input id="tokenInput" type="text" placeholder="XXXXXXXX-XXXXXXXX" style="width:100%;padding:14px 16px;border:2px solid #d8dee2;border-radius:14px;font-size:16px;outline:0;box-sizing:border-box;text-align:center;font-family:inherit" autocomplete="off" />
        <div id="tokenError" style="color:#e53935;font-size:13px;margin-top:10px;display:none"></div>
        <button id="tokenSubmit" type="button" style="width:100%;margin-top:18px;padding:14px;background:#000;color:#fff;border:0;border-radius:14px;font-size:16px;font-weight:600;font-family:inherit;cursor:pointer">Увійти</button>
      </div>
    </div>
    <div id="app"></div>
    <script>
      (function () {
        var tokenGate = document.getElementById("tokenGate");
        var tokenInput = document.getElementById("tokenInput");
        var tokenError = document.getElementById("tokenError");
        var tokenSubmit = document.getElementById("tokenSubmit");

        function validateOnServer(token) {
          return fetch("/api/validate-token?token=" + encodeURIComponent(token))
            .then(function (r) { return r.json(); });
        }

        function unlockAccess(token, data) {
          localStorage.setItem("auth_token", token);
          var expMs = data.exp ? Math.floor(data.exp * 1000) : Date.now() + 4 * 60 * 60 * 1000;
          localStorage.setItem("auth_token_expires", String(expMs));
          localStorage.setItem("auth_name", data.name || "");
          localStorage.setItem("auth_photo_id", data.photo_id || "");
          tokenGate.style.display = "none";
          document.documentElement.classList.remove("token-auth-locked");
        }

        function showError(msg) {
          tokenError.textContent = msg;
          tokenError.style.display = "block";
        }

        function hideError() {
          tokenError.style.display = "none";
        }

        function lockGate() {
          tokenGate.style.display = "flex";
          document.documentElement.classList.add("token-auth-locked");
        }

        // Check cached token on load — validate with server
        (function checkExistingToken() {
          var cachedToken = localStorage.getItem("auth_token");
          var cachedExpiry = localStorage.getItem("auth_token_expires");

          if (cachedToken && cachedExpiry && Date.now() < parseInt(cachedExpiry, 10)) {
            tokenInput.disabled = true;
            tokenSubmit.disabled = true;
            tokenSubmit.textContent = "Перевірка...";
            lockGate();

            validateOnServer(cachedToken).then(function (data) {
              if (data && data.valid) {
                unlockAccess(cachedToken, data);
              } else {
                // Server says invalid — clear and show error only if we're sure
                localStorage.removeItem("auth_token");
                localStorage.removeItem("auth_token_expires");
                localStorage.removeItem("auth_name");
                localStorage.removeItem("auth_photo_id");
                tokenInput.disabled = false;
                tokenSubmit.disabled = false;
                tokenSubmit.textContent = "Увійти";
                showError("Токен відкликано або прострочено");
              }
            }).catch(function () {
              // Network error — keep the cached session and try again later
              tokenInput.disabled = false;
              tokenSubmit.disabled = false;
              tokenSubmit.textContent = "Увійти";
              lockGate();
            });
          } else {
            localStorage.removeItem("auth_token");
            localStorage.removeItem("auth_token_expires");
            localStorage.removeItem("auth_name");
            localStorage.removeItem("auth_photo_id");
            lockGate();
          }
        })();

        function handleSubmit() {
          var token = tokenInput.value.trim();
          if (!token) {
            showError("Введіть токен");
            return;
          }
          hideError();
          tokenSubmit.disabled = true;
          tokenSubmit.textContent = "Перевірка...";
          validateOnServer(token).then(function (data) {
            tokenSubmit.disabled = false;
            tokenSubmit.textContent = "Увійти";
            if (data.valid) {
              unlockAccess(token, data);
            } else {
              showError("Невірний або прострочений токен");
            }
          }).catch(function () {
            tokenSubmit.disabled = false;
            tokenSubmit.textContent = "Увійти";
            showError("Сервер недоступний");
          });
        }

        tokenSubmit.addEventListener("click", handleSubmit);
        tokenInput.addEventListener("keydown", function (e) {
          if (e.key === "Enter") handleSubmit();
        });
      })();
    </script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("/service-worker.js", { scope: "/" }).catch(function () {});
        });
      }

      (function () {
        function updateNativeSliderCards() {
          document.querySelectorAll(".slider").forEach(function (slider) {
            var cards = Array.prototype.slice.call(slider.children);
            if (!cards.length) return;

            var index = parseInt(getComputedStyle(slider).getPropertyValue("--index"), 10);
            if (!Number.isFinite(index)) index = 0;

            cards.forEach(function (card, cardIndex) {
              card.classList.toggle("is-slider-active", cardIndex === index);
              card.classList.toggle("is-slider-prev", cardIndex === index - 1);
              card.classList.toggle("is-slider-next", cardIndex === index + 1);
            });
          });
        }

        var frame = null;
        function scheduleNativeSliderUpdate() {
          if (frame) return;
          frame = requestAnimationFrame(function () {
            frame = null;
            updateNativeSliderCards();
          });
        }

        window.addEventListener("load", scheduleNativeSliderUpdate);
        window.addEventListener("resize", scheduleNativeSliderUpdate);
        setInterval(scheduleNativeSliderUpdate, 250);
      })();
    </script>
